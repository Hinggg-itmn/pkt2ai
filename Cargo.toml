[package]
name = "pkt2ai"
version = "0.1.0"
edition = "2024"
description = "Decode Cisco Packet Tracer files and inspect their topology"
license = "MIT"

[lib]
name = "pkt2ai"
path = "src/lib.rs"

[[bin]]
name = "pkt2ai"
path = "src/main.rs"

[features]
default = ["tui"]
tui = ["dep:crossterm", "dep:ratatui"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.28.1", optional = true }
flate2 = "1.1.10"
regex = "1.13.1"
roxmltree = "0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ratatui = { version = "0.29.0", optional = true }

[profile.release]
lto = "thin"
strip = true
