[package]
name = "pkt2ai"
version = "0.1.0"
edition = "2024"
description = "Decode Cisco Packet Tracer files and inspect their topology"
license = "MIT"

[lib]
name = "pkt2ai"
path = "src/lib.rs"

[[bin]]
name = "pkt2ai"
path = "src/main.rs"

[features]
default = []

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
regex = "1.13.1"
roxmltree = "0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
lto = "thin"
strip = true
